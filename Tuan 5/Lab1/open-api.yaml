openapi: 3.0.0
info:
  title: Books Management API
  version: 1.0.0
  description: Flask REST API with Swagger UI Documentation
paths:
  /books:
    get:
      summary: Lấy danh sách tất cả sách
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Book'
                  total:
                    type: integer
    post:
      summary: Tạo mới một quyển sách
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - author
              properties:
                title:
                  type: string
                author:
                  type: string
      responses:
        '201':
          description: Đã tạo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '415':
          description: Expected JSON
        '422':
          description: Title và author là bắt buộc

  /books/{bid}:
    get:
      summary: Lấy thông tin sách theo ID
      parameters:
        - name: bid
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          description: Không tìm thấy sách
    put:
      summary: Cập nhật toàn bộ thông tin sách (PUT)
      parameters:
        - name: bid
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                t:
                  type: string
                  description: Title mới
                a:
                  type: string
                  description: Author mới
      responses:
        '200':
          description: Cập nhật thành công
        '404':
          description: Không tìm thấy sách
    patch:
      summary: Cập nhật một phần thông tin sách (PATCH)
      parameters:
        - name: bid
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                author:
                  type: string
      responses:
        '200':
          description: Cập nhật thành công
        '404':
          description: Không tìm thấy sách
    delete:
      summary: Xóa sách theo ID
      parameters:
        - name: bid
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Xóa thành công
        '404':
          description: Không tìm thấy sách

components:
  schemas:
    Book:
      type: object
      properties:
        id:
          type: integer
        author:
          type: string
        title:
          type: string